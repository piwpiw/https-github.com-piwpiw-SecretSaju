<!DOCTYPE html>
<html lang="ko">
<!--
  기기 캐시 리셋 페이지 (/reset.html)

  옛 배포의 서비스워커가 기기에 남아 캐시된 옛 화면을 계속 보여주는
  사고("고쳐도 계속 옛날 화면")의 사용자용 원클릭 복구 수단이다.
  설정 메뉴를 뒤지지 않고 이 주소 한 번 열면: 모든 서비스워커 등록
  해제 → 모든 캐시 삭제 → 홈으로 이동.

  ⚠️ localStorage 는 절대 건드리지 않는다 — 비로그인 사용자의 지갑·
  해금 기록이 localStorage 에 있다 (지우면 자산이 사라진다).

  Next 빌드를 거치지 않는 순수 정적 파일이라 앱이 깨진 상태에서도 동작한다.
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>화면 새로 고치기 — 시크릿사주</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #020617; color: #e2e8f0; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
    .box { text-align: center; padding: 32px; }
    .spin { width: 40px; height: 40px; margin: 0 auto 20px; border: 3px solid rgba(129,140,248,.25);
            border-top-color: #818cf8; border-radius: 50%; animation: r 0.9s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #94a3b8; margin: 0; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <h1>저장된 옛 화면을 지우는 중입니다</h1>
    <p id="s">잠시만 기다려 주세요…</p>
  </div>
  <script>
    (async () => {
      const s = document.getElementById('s');
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister().catch(() => false)));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k).catch(() => false)));
        }
        s.textContent = '완료! 새 화면으로 이동합니다…';
      } catch (e) {
        s.textContent = '일부 항목을 지우지 못했습니다. 그대로 이동합니다…';
      }
      // 캐시 우회 쿼리로 홈을 강제 재요청한다.
      setTimeout(() => location.replace('/?fresh=' + Date.now()), 1200);
    })();
  </script>
</body>
</html>
