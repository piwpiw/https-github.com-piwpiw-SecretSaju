name: Quality CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "archives/docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "archives/docs/**"
      - "archives/**"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
    timeout-minutes: 25
    outputs:
      q_failed: ${{ steps.quality-check.outputs.failed }}
    env:
      RUN_TESTS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-tests')) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund

      - name: Run quality checks in parallel
        id: quality-check
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/tsc.log 2>&1 &
          TSC_PID=$!
          npm run lint > /tmp/lint.log 2>&1 &
          LINT_PID=$!

          if [ "$RUN_TESTS" = "true" ]; then
            npm test -- --run > /tmp/test.log 2>&1 &
            TEST_PID=$!
          else
            : > /tmp/test.log
            echo "skip tests for non-main/pr quality checks. add PR label 'run-tests' to run." >> /tmp/test.log
            TEST_PID=0
          fi

          wait $TSC_PID; TSC_EXIT=$?
          wait $LINT_PID; LINT_EXIT=$?
          if [ "$RUN_TESTS" = "true" ]; then
            wait $TEST_PID; TEST_EXIT=$?
          else
            TEST_EXIT=0
          fi

          if [ $TSC_EXIT -ne 0 ]; then
            echo "--- TypeScript check failed ---"
            cat /tmp/tsc.log
          fi
          if [ $LINT_EXIT -ne 0 ]; then
            echo "--- Lint failed ---"
            cat /tmp/lint.log
          fi
          if [ $TEST_EXIT -ne 0 ]; then
            echo "--- Test failed ---"
            cat /tmp/test.log
          fi

          if [ $TSC_EXIT -ne 0 ] || [ $LINT_EXIT -ne 0 ] || [ $TEST_EXIT -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bundle quality triage
        if: always()
        run: |
          tar -czf /tmp/quality-triage-${{ github.run_id }}-${{ github.run_attempt }}.tgz \
            /tmp/tsc.log \
            /tmp/lint.log \
            /tmp/test.log \
            --ignore-failed-read || true

      - name: Upload quality triage bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-triage-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/quality-triage-${{ github.run_id }}-${{ github.run_attempt }}.tgz
          retention-days: 7

      - name: Publish quality summary
        if: always()
        run: |
          {
            echo "## Quality Gate Summary"
            echo ""
            echo "- event: \`${{ github.event_name }}\`"
            echo "- ref: \`${{ github.ref_name }}\`"
            echo "- run-tests: \`${RUN_TESTS}\`"
            echo ""
            echo "### logs"
            echo "- /tmp/tsc.log"
            echo "- /tmp/lint.log"
            echo "- /tmp/test.log"
          } >> "$GITHUB_STEP_SUMMARY"
